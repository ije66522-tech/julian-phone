<title>Julian's iPhone 18 Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{background:radial-gradient(ellipse at 50% 30%,#2a2d36,#0b0c10 70%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Apple SD Gothic Neo",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;color:#000;touch-action:none}

.off{opacity:.3}

#island .il,#island .ir{opacity:0;transition:opacity .25s;white-space:nowrap;display:flex;align-items:center;gap:6px}
#island.wide{width:196px}
#island.wide .il,#island.wide .ir{opacity:1}
#camDot{position:absolute;top:22px;left:calc(50% + 70px);width:7px;height:7px;border-radius:50%;background:#30d158;z-index:61;display:none}
.ilabel{font-size:13px}
/* home */
#home{position:absolute;inset:0;z-index:1;transition:transform .35s,opacity .35s,filter .35s;overflow:hidden}
#home.away{transform:scale(.88);opacity:0;filter:blur(6px);pointer-events:none}
.pages{display:flex;height:100%;transition:transform .38s cubic-bezier(.2,.9,.3,1)}
.page{width:393px;flex:none;padding:66px 20px 0}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:0 6px 16px}
.widget{height:158px;border-radius:24px;padding:14px 16px;position:relative;overflow:hidden;cursor:pointer}
.wlabel{text-align:center;color:#fff;font-size:12px;margin-top:6px;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.w-weather{background:linear-gradient(180deg,#5b6f8a,#8ea3bd);color:#fff}
.w-cal{background:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:22px;justify-items:center}
.ic{width:66px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative}
.ic:active .ico{filter:brightness(.75)}
.ico{width:62px;height:62px;border-radius:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.18);flex:none}
.ic span{color:#fff;font-size:11.5px;text-shadow:0 1px 3px rgba(0,0,0,.5);white-space:nowrap;letter-spacing:-.1px;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px;z-index:2}
.spill{position:absolute;left:50%;transform:translateX(-50%);bottom:122px;background:rgba(255,255,255,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:13px;padding:6px 14px;border-radius:16px;display:flex;gap:6px;align-items:center;cursor:pointer;min-height:28px}
.spill i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}
.spill i.on{background:#fff}
.dock{position:absolute;left:12px;right:12px;bottom:12px;height:94px;border-radius:36px;background:rgba(255,255,255,.22);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);display:flex;justify-content:space-around;align-items:center;padding:0 10px}
.dock .ic span{display:none}
#spot{position:absolute;inset:0;z-index:44;background:rgba(20,20,30,.45);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);display:none;flex-direction:column;padding:60px 16px 0;color:#fff}
#spot.show{display:flex}
#spot .si{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.2);border-radius:12px;padding:10px 12px}
#spot input{flex:1;background:none;border:0;outline:none;color:#fff;font-size:17px}
#spot input::placeholder{color:rgba(255,255,255,.6)}
/* apps */
.app{position:absolute;inset:0;background:#fff;z-index:20;display:none;flex-direction:column;overflow:hidden;transform-origin:0 0;border-radius:56px}
.app.open{display:flex}
.app.anim{transition:transform .42s cubic-bezier(.2,.9,.25,1),opacity .3s,border-radius .42s}
.body{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;touch-action:pan-y;min-height:0}
.body::-webkit-scrollbar{display:none}
.top-pad{height:54px;flex:none}
.navbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none;font-size:17px}
.navbar .ttl{font-weight:600}
.blue{color:#007aff}
.nb{color:#007aff;font-size:17px;display:flex;align-items:center;gap:2px;cursor:pointer;min-width:60px}
.nb.r{justify-content:flex-end}
.large{font-size:34px;font-weight:700;padding:2px 16px 8px;letter-spacing:-.5px}
.gbg{background:#f2f2f7}
.group{background:#fff;border-radius:12px;margin:0 16px 22px;overflow:hidden}
.dk .group{background:#1c1c1e}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;font-size:17px;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:#c6c6c8}

.dk .row+.row::before{background:#38383a}
.row .sub{color:#8e8e93;font-size:15px;margin-left:auto}
.chev{color:#c4c4c6;font-size:20px;margin-left:auto}
.sic{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex:none}
.tg{width:51px;height:31px;border-radius:16px;background:#e9e9ea;position:relative;transition:background .25s;flex:none;margin-left:auto;cursor:pointer}
.dk .tg{background:#39393d}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s}

.tg.on::after{transform:translateX(20px)}
.search{margin:0 16px 12px;background:#e3e3e8;border-radius:10px;height:36px;display:flex;align-items:center;gap:6px;padding:0 10px;color:#8e8e93;font-size:17px;flex:none}

.tabbar{flex:none;height:84px;padding-bottom:30px;display:flex;justify-content:space-around;align-items:center;background:rgba(249,249,249,.94);border-top:.5px solid #d1d1d6}
.dk .tabbar{background:rgba(22,22,24,.95);border-top-color:#333}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#999;cursor:pointer;min-width:60px}
.tab.on{color:var(--acc,#007aff)}
.tab .t{font-size:22px;line-height:26px}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none}
.sec{font-size:13px;color:#8e8e93;padding:6px 16px 4px;background:#f7f7f7;font-weight:600}
.btnfill{background:#007aff;color:#fff;border-radius:12px;padding:14px;font-size:17px;font-weight:600;width:100%}
.field{width:100%;border:0;outline:none;font-size:17px;padding:12px 16px;background:#fff;color:inherit}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#f2f2f7;border-radius:14px 14px 0 0;z-index:5;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-height:92%;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.15)}
.sheet.show{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:#c7c7cc;margin:6px auto 0;flex:none}
.empty{color:#8e8e93;text-align:center;padding:40px 20px;font-size:15px;line-height:1.5}
.offline{position:absolute;inset:0;z-index:9;background:rgba(255,255,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#333;text-align:center;padding:30px}
.offline b{font-size:19px}.offline p{color:#8e8e93;font-size:15px}
.card{background:#fff;border-radius:14px;margin:0 16px 12px;padding:14px 16px}
.dk .card{background:#1c1c1e}
.seg{display:flex;background:#e3e3e8;border-radius:9px;padding:2px;margin:0 16px 12px}
.seg span{flex:1;text-align:center;padding:6px;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer}
.seg span.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pill{display:inline-block;background:#007aff;color:#fff;border-radius:16px;padding:6px 16px;font-size:15px;font-weight:700;cursor:pointer}
.pill.g{background:#eef0f4;color:#007aff}
/* lock */
#lock{position:absolute;inset:0;z-index:40;overflow:hidden;transition:transform .45s cubic-bezier(.2,.9,.3,1),opacity .45s;color:#fff}
#lock.gone{transform:translateY(-100%);opacity:.4;pointer-events:none}
.lk-date{text-align:center;margin-top:70px;font-size:20px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.2)}

#lkNotifs{position:absolute;left:10px;right:10px;bottom:120px;display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:hidden;justify-content:flex-end}
.lk-btm{position:absolute;bottom:44px;left:44px;right:44px;display:flex;justify-content:space-between}
.lk-rb{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.3);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.lk-rb.on{background:#fff;color:#000}
.lk-hint{position:absolute;bottom:52px;left:0;right:0;text-align:center;font-size:13px;opacity:.75;pointer-events:none;animation:hint 2.4s infinite}
@keyframes fin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes eqb{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.75}50%{transform:translateY(-6px);opacity:.4}}
.nowp{background:rgba(30,30,30,.45);backdrop-filter:blur(30px);border-radius:22px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:10px}
.nt{background:rgba(245,245,245,.78);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);border-radius:22px;padding:12px 14px;display:flex;gap:10px;align-items:center;color:#000;cursor:pointer}
.nt .nico{width:38px;height:38px;border-radius:9px;flex:none;overflow:hidden;display:flex}
.nt .nico .ico{width:38px;height:38px;border-radius:9px;box-shadow:none}
.nt .nico .ico>*{transform:scale(.62)}
.nt .ntx{flex:1;min-width:0}
.nt .nh{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.nt .nh small{font-weight:400;color:#6e6e73;font-size:13px}
.nt .nb2{font-size:15px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#banner{position:absolute;top:8px;left:8px;right:8px;z-index:55;transform:translateY(-140%);transition:transform .45s cubic-bezier(.2,1.2,.4,1)}
#banner.show{transform:none}
#banner .nt{box-shadow:0 8px 30px rgba(0,0,0,.25)}
#nc{position:absolute;inset:0;z-index:45;transform:translateY(-100%);transition:transform .4s cubic-bezier(.2,.9,.3,1);color:#fff;overflow:hidden}
#nc.show{transform:none}
#nc .ncbg{position:absolute;inset:0;filter:blur(30px) brightness(.7);transform:scale(1.2)}
#nc .inner{position:relative;height:100%;display:flex;flex-direction:column;padding:0 10px}
#ncList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:60px;scrollbar-width:none}
.nc-h{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;font-size:20px;font-weight:700}
.nc-h button{font-size:13px;background:rgba(255,255,255,.25);padding:6px 12px;border-radius:14px;color:#fff}
/* cc */
#cc{position:absolute;inset:0;z-index:46;background:rgba(10,10,20,.35);backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);opacity:0;pointer-events:none;transition:opacity .3s;color:#fff}
#cc.show{opacity:1;pointer-events:auto}
.ccg{position:absolute;top:140px;left:26px;right:26px;display:grid;grid-template-columns:repeat(4,72px);grid-auto-rows:72px;gap:16px;justify-content:space-between;transform:scale(.92);transform-origin:top center;transition:transform .35s cubic-bezier(.2,1.3,.4,1)}
#cc.show .ccg{transform:none}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -2px 6px rgba(0,0,0,.12),0 6px 20px rgba(0,0,0,.12);backdrop-filter:blur(18px) saturate(1.8);-webkit-backdrop-filter:blur(18px) saturate(1.8);border-radius:34px;position:relative;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.glass.round{border-radius:50%}
.glass.on{background:rgba(255,255,255,.92);color:#222}
.glass.on.red{color:#ff3b30}
.ccb{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:background .2s;box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
.conn{grid-column:1/3;grid-row:1/3;padding:14px;cursor:default}
.media{grid-column:3/5;grid-row:1/3;padding:16px;flex-direction:column;align-items:stretch;justify-content:space-between;cursor:default}
.media .mt{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media .ma{font-size:14px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.media .mc{display:flex;justify-content:space-around;align-items:center}
.media .mc button{color:#fff;display:flex}
.vs{grid-row:span 2;border-radius:36px!important;overflow:hidden;cursor:ns-resize;touch-action:none;align-items:flex-end!important}
.vs i{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.95)}
.vs .vi{position:absolute;bottom:22px;left:0;right:0;pointer-events:none}
.focus{grid-column:span 2;justify-content:flex-start!important;gap:12px;padding:0 14px;font-size:17px;font-weight:600}
.focus .fi{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.focus.on .fi{background:#5e5ce6;color:#fff}
#volHud{position:absolute;left:8px;top:200px;width:12px;height:150px;border-radius:7px;background:rgba(80,80,80,.55);backdrop-filter:blur(20px);z-index:62;overflow:hidden;opacity:0;transition:opacity .3s,width .3s;pointer-events:none}

#volHud i{position:absolute;bottom:0;left:0;right:0;background:#fff;transition:height .15s}
#hi{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:58;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;cursor:pointer;touch-action:none}
#hi div{width:140px;height:5px;border-radius:3px;background:#fff;transition:background .25s}
#hi.dark div{background:#000}
#dim{position:absolute;inset:0;background:#000;z-index:200;pointer-events:none;opacity:0}
#flashOv{position:absolute;inset:0;background:#fff;z-index:150;pointer-events:none;opacity:0;transition:opacity .25s}
#offScreen{position:absolute;inset:0;background:#000;z-index:300;display:none}
/* call & alarm */
#call,#alarmOv{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;color:#fff;background:linear-gradient(180deg,#3a3f4b,#16181d);padding-top:110px}
#alarmOv{z-index:35;background:linear-gradient(180deg,#1b1b2f,#000)}
#call.show,#alarmOv.show{display:flex}
.call-n{font-size:34px;font-weight:500;margin-top:14px;text-align:center;padding:0 20px}
.call-s{font-size:17px;opacity:.7;margin-top:4px}
.call-g{display:grid;grid-template-columns:repeat(3,76px);gap:24px 30px;margin-top:auto;margin-bottom:40px}
.cg{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}

.cg.on b{background:#fff;color:#000}
.endb{width:76px;height:76px;border-radius:50%;background:#ff3b30;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:70px}
.accb{background:#34c759}
.kp{display:grid;grid-template-columns:repeat(3,80px);gap:16px 26px;justify-content:center}
.key{width:80px;height:80px;border-radius:50%;background:#e5e5ea;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}

.key b{font-size:34px;font-weight:400;line-height:1}
.key small{font-size:10px;letter-spacing:2px;font-weight:600;margin-top:1px}

.bub.them{background:#e9e9eb;align-self:flex-start;border-bottom-left-radius:6px}
.typing{display:flex;gap:4px;padding:12px 14px}

.inbar{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px 36px;border-top:.5px solid #ddd;background:#fff}
.inbar input{flex:1;border:1px solid #d1d1d6;border-radius:18px;padding:8px 14px;font-size:16px;outline:none}
.sendb{width:32px;height:32px;border-radius:50%;background:#0a84ff;color:#fff;font-size:18px;font-weight:700}
/* camera */
.vf{position:absolute;left:0;right:0;top:118px;height:524px;overflow:hidden;background:#111}
.vf video{width:100%;height:100%;object-fit:cover}
.fake{position:absolute;inset:0;animation:drift 12s ease-in-out infinite alternate;background-size:cover}

let call=null,callOpen=false,callT=null;
const endSVG=sv(`<path fill="#fff" transform="rotate(135 12 12)" d="${PH}"/>`);
function startCall(phone,incoming=false){
  const c=byPhone(phone);
  call={phone,name:c?c.name:phone,c,state:incoming?'ringing':'dialing',sec:0,mute:false,spk:false};
  if(incoming)ringStart();else{D.recents.unshift({phone,type:'out',t:Date.now()});D.recents=D.recents.slice(0,40);save();
    setTimeout(()=>{if(call&&call.state==='dialing'){call.state='active';tickCall()}},4200);
    [0,1.5,3].forEach(w=>{tone(400,.4,'sine',.25,w);tone(450,.4,'sine',.25,w);tone(400,.4,'sine',.25,w+.6);tone(450,.4,'sine',.25,w+.6)})}

  ringStop();clearInterval(callT);call=null;callOpen=false;$('#call').classList.remove('show');

    <div class="endb" data-c="end">${endSVG}</div>`;
  }
  $$('#call [data-c]').forEach(n=>n.onclick=()=>{const k=n.dataset.c;

const cs={d:'0',acc:null,op:null,fresh:true};
function renderCalculator(el){
  el.classList.add('dk');
  const fmt=v=>{const n=parseFloat(v);if(!isFinite(n))return 'Error';if(String(v).endsWith('.'))return v;const s=Math.abs(n)>=1e9?n.toExponential(4):String(+n.toPrecision(10));return s.includes('e')?s:Number(s).toLocaleString('en-GB',{maximumFractionDigits:8})+(String(v).match(/\.\d*0+$/)?String(v).match(/0+$/)[0]:'')};
  const keys=[['AC','f'],['±','f'],['%','f'],['÷','o'],['7'],['8'],['9'],['×','o'],['4'],['5'],['6'],['−','o'],['1'],['2'],['3'],['+','o'],['0','z'],['.'],['=','o']];
  const disp=fmt(cs.d);
  el.innerHTML=`<div class="top-pad"></div><div style="flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 26px 10px;font-size:${disp.length>9?56:86}px;font-weight:300;color:#fff">${disp}</div><div class="calc">${keys.map(k=>`<div class="cbtn ${k[1]||''} ${cs.op===k[0]&&cs.fresh?'sel':''}" data-k="${k[0]}">${k[0]==='AC'&&cs.d!=='0'?'C':k[0]}</div>`).join('')}</div>`;
  const op=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;
  $$('[data-k]',el).forEach(n=>n.onclick=()=>{const k=n.dataset.k;
    if(/\d/.test(k)){if(cs.fresh){cs.d=k;cs.fresh=false}else if(cs.d.length<9)cs.d=cs.d==='0'?k:cs.d+k}
    else if(k==='.'){if(cs.fresh){cs.d='0.';cs.fresh=false}else if(!cs.d.includes('.'))cs.d+='.'}
    else if(k==='AC'){if(cs.d!=='0'){cs.d='0'}else{cs.acc=null;cs.op=null}cs.fresh=true}
    else if(k==='±')cs.d=String(-parseFloat(cs.d));
    else if(k==='%')cs.d=String(parseFloat(cs.d)/100);
    else if(k==='='){if(cs.op!==null&&cs.acc!==null){cs.d=String(op(cs.acc,parseFloat(cs.d),cs.op));cs.acc=null;cs.op=null}cs.fresh=true}
    else{if(cs.op&&!cs.fresh&&cs.acc!==null)cs.d=String(op(cs.acc,parseFloat(cs.d),cs.op));cs.acc=parseFloat(cs.d);cs.op=k;cs.fresh=true}
    tone(1200,.02,'sine',.15);renderCalculator(el)});
}

 sun:'<g fill="#ffc400" stroke="#ffc400" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g>',
 spk:'<path fill="#2b8cff" d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="#2b8cff" stroke-width="1.9" stroke-linecap="round"/>',
 mute:'<path fill="#2b8cff" d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" stroke="#2b8cff" stroke-width="1.9" stroke-linecap="round"/>',
 phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>',
 plus:'<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 power:'<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M7.5 6.2a7.5 7.5 0 1 0 9 0"/></g>',
 prev:'<path fill="currentColor" d="M12 6v12L3 12zM21 6v12l-9-6z"/>',next:'<path fill="currentColor" d="M3 6v12l9-6zM12 6v12l9-6z"/>',
 play:'<path fill="currentColor" d="M7 4.5v15l13-7.5z"/>',pause:'<g fill="currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></g>'
};
function renderCC(){
  const tr=TRACKS[mus.i];const g='glass';
  const bc=(k,on,col,size,ic,s)=>`<div class="ccb" data-t="${k}" style="width:${size}px;height:${size}px;background:${on?col:'rgba(255,255,255,.14)'};${on?'box-shadow:none':''}">${SVI(CCI[ic],s)}</div>`;
  $('#cc').innerHTML=`<div style="position:absolute;top:58px;left:30px;right:30px;display:flex;justify-content:space-between;color:#fff"><span data-o="edit" style="cursor:pointer">${SVI(CCI.plus,26)}</span><span data-o="power" style="cursor:pointer">${SVI(CCI.power,24)}</span></div>
  <div style="position:absolute;top:104px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:15px;font-weight:600"><span style="display:flex;gap:6px;align-items:center">${S.air?SVI(CCI.air,16):SVI(CCI.cell,16,(S.cell?'':'opacity:.35'))}${S.wifi?SVI(CCI.wifi,18):''}</span><span style="display:flex;gap:6px;align-items:center">${S.battery}% <span class="batt" style="color:#fff"><i style="width:${S.battery}%"></i></span></span></div>
  <div class="ccg">
   <div class="${g} conn"><div style="display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;width:100%;height:100%;place-items:center">
     ${bc('air',S.air,'#ff9f0a',60,'air',26)}${bc('drop',S.drop,'#0a84ff',60,'drop',28)}${bc('wifi',S.wifi,'#0a84ff',60,'wifi',28)}
     <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${bc('cell',S.cell&&!S.air,'#30d158',28,'cell',15)}${bc('bt',S.bt,'#0a84ff',28,'bt',16)}${bc('hot',S.hot,'#30d158',28,'link',15)}${bc('vpn',S.vpn,'#0a84ff',28,'globe',15)}</div></div></div>
   <div class="${g} media"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="width:62px;height:62px;border-radius:14px;background:${tr.art};background-size:cover;box-shadow:0 4px 10px rgba(0,0,0,.3)"></div><span style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center">${SVI(CCI.phone,18)}</span></div>
     <div style="min-width:0"><div class="mt">${mus.on||mus.pos?esc(tr.t):'Not Playing'}</div><div class="ma">${mus.on||mus.pos?esc(tr.a):'Music'}</div></div>
     <div class="mc"><button data-m="prev">${SVI(CCI.prev,24)}</button><button data-m="play">${SVI(mus.on?CCI.pause:CCI.play,30)}</button><button data-m="next">${SVI(CCI.next,24)}</button></div></div>
   <div class="${g} round ${S.rot?'on':''}" data-t="rot">${SVI(CCI.rot,30)}</div>
   <div class="${g} round ${S.silent?'on red':''}" data-t="silent">${SVI(S.silent?CCI.belloff:CCI.bell,28)}</div>
   <div class="vs ${g}" data-s="bright"><i style="height:${S.bright*100}%"></i><span class="vi">${SVI(CCI.sun,30,'margin:0 auto')}</span></div>
   <div class="vs ${g}" data-s="vol"><i style="height:${S.vol*100}%"></i><span class="vi">${SVI(S.vol===0?CCI.mute:CCI.spk,30,'margin:0 auto')}</span></div>
   <div class="${g} focus ${S.focus?'on':''}" data-t="focus"><span class="fi">${SVI(CCI.moon,22)}</span><span>${S.focus?'Do Not Disturb':'Focus'}</span><span style="opacity:.6;font-size:12px">⌃⌄</span></div>
   <div class="${g} round ${S.flash?'on':''}" data-t="flash">${SVI(CCI.torch,28)}</div>
   <div class="${g} round" data-o="clock">${SVI(CCI.timer,28)}</div>
   <div class="${g} round" data-o="calculator">${SVI(CCI.calc,28)}</div>
   <div class="${g} round" data-o="camera">${SVI(CCI.cam,28)}</div>
  </div>`;
  $$('#cc [data-t]').forEach(n=>n.onclick=e=>{e.stopPropagation();const k=n.dataset.t;if(['drop','hot','vpn'].includes(k)){S[k]=!S[k];vib(8);save();renderCC();return}toggle(k)});
  $$('#cc [data-m]').forEach(n=>n.onclick=e=>{e.stopPropagation();const m=n.dataset.m;if(m==='play')musToggle();else musNext(m==='next'?1:-1);renderCC()});
  $$('#cc [data-o]').forEach(n=>n.onclick=e=>{e.stopPropagation();const o=n.dataset.o;if(o==='edit'){islandFlash('<span>＋</span>','<span class="ilabel">Edit Controls</span>',1000);return}if(o==='power'){closeCC();lock();return}closeCC();openApp(o,null,o==='clock'?{tab:'timer'}:{})});
  $$('#cc .vs').forEach(n=>{
    const set=e=>{const r=n.getBoundingClientRect();let v=Math.max(0,Math.min(1,(r.bottom-e.clientY)/r.height));if(n.dataset.s==='bright'){S.bright=Math.max(.12,v);applyBright()}else S.vol=Math.round(v*16)/16;$('i',n).style.height=(n.dataset.s==='bright'?S.bright:S.vol)*100+'%';if(n.dataset.s==='vol')$('.vi',n).innerHTML=SVI(S.vol===0?CCI.mute:CCI.spk,30,'margin:0 auto')};
    n.onpointerdown=e=>{e.stopPropagation();n.setPointerCapture(e.pointerId);n._d=1;set(e)};n.onpointermove=e=>{if(n._d)set(e)};
    n.onpointerup=()=>{n._d=0;save();if(n.dataset.s==='vol'&&!mus.on)tone(880,.1,'sine',.8,0,true)}});
}
$('#cc').addEventListener('click',e=>{if(['cc'].includes(e.target.id)||e.target.classList.contains('ccg')||e.target.classList.contains('ccTop'))closeCC()});

/* ================= notifications ================= */
let ncOpen=false;const NOTIFS=[];
function openNC(){if(ccOpen)closeCC();closeSpot();ncOpen=true;renderNC();$('#nc').classList.add('show');updateSB()}
function closeNC(){if(!ncOpen)return;ncOpen=false;$('#nc').classList.remove('show');updateSB()}
function ntHTML(n,i){return `<div class="nt" data-n="${i}"><div class="nico">${ico(n.app)}</div><div class="ntx"><div class="nh"><span>${esc(n.title)}</span><small>${Date.now()-n.t<60e3?'now':Date.now()-n.t<36e5?Math.floor((Date.now()-n.t)/6e4)+'m ago':tsHM(n.t)}</small></div><div class="nb2">${esc(n.body)}</div></div></div>`}
function renderNC(){const Lst=$('#ncList');Lst.innerHTML=NOTIFS.length?NOTIFS.map(ntHTML).join(''):'<div style="text-align:center;opacity:.7;margin-top:40px">No Older Notifications</div>';
  $$('#ncList [data-n]').forEach(n=>n.onclick=()=>{const x=NOTIFS.splice(+n.dataset.n,1)[0];closeNC();tapNotif(x)})}
$('#ncClear').onclick=()=>{NOTIFS.length=0;renderNC();renderLock()};
function tapNotif(n){if(!n)return;if(locked){unlock(true);setTimeout(()=>tapNotif(n),450);return}if(n.thread)msgThread=n.thread;if(n.app==='mail'){ml.view='list';ml.box='inbox'}if(n.app==='gmail'){gm.view='list';gm.box='inbox'}if(n.slchat){sl.view='chat';sl.chat=n.slchat}const o=n.thread?{thread:n.thread}:n.wa?{wa:n.wa}:n.ig?{ig:n.ig}:{};if(n.wa){wa.story=null;wa.pick=null}openApp(n.app,null,o);renderLock()}
let bannerTO=null;
function notify(n){
  n.t=Date.now();if(['instagram','maps','uber','mail','news','gmail','whatsapp','setlog'].includes(n.app)&&!online())return;
  NOTIFS.unshift(n);if(NOTIFS.length>30)NOTIFS.pop();
  if(current!==n.app||n.force){D.badges[n.app]=(D.badges[n.app]||0)+1;save();if(!current)renderHome()}
  if(ncOpen)renderNC();
  if(S.focus){if(locked)renderLock();return}
  ding();
  if(locked){renderLock();if(screenOff){const sc=$('#offScreen');sc.style.display='none';setTimeout(()=>{if(screenOff)sc.style.display='block'},5000)}return}
  if(current===n.app&&!n.force)return;
  const b=$('#banner');b.innerHTML=ntHTML(n,0);b.classList.add('show');
  b.firstChild.onclick=()=>{b.classList.remove('show');const i=NOTIFS.indexOf(n);if(i>=0)NOTIFS.splice(i,1);tapNotif(n)};
  clearTimeout(bannerTO);bannerTO=setTimeout(()=>b.classList.remove('show'),4800);
}
let bsy=null;$('#banner').addEventListener('pointerdown',e=>{bsy=e.clientY});$('#banner').addEventListener('pointermove',e=>{if(bsy!==null&&e.clientY-bsy<-15){$('#banner').classList.remove('show');bsy=null}});
function pushRandom(force){
  const mates=D.contacts.filter(x=>[3,4,5,6,7,8].includes(x.id));const c=rand(mates)||D.contacts[0];const ne=nextEvent();
  const pool=[
    ()=>{const t=rand(['drinks at the club later?','darling, did you see that 😂','running 10 mins late','supper Thursday?','are you still at EXIA?','Verbier dates confirmed ❄️','call me when you\'re free','tennis tomorrow?']);(D.threads[c.id]=D.threads[c.id]||[]).push({me:0,text:t,t:Date.now()});save();return{app:'messages',title:c.name,body:t,thread:c.id}},
    ()=>({app:'instagram',title:'Instagram',body:rand([rand(IGU)+' liked your post.',rand(IGU)+' started following you.',rand(IGU)+' commented: "absolute scenes 🔥"',rand(IGU)+' added to their story.'])}),
    ()=>ne?{app:'calendar',title:ne.title,body:`Today at ${ne.t}`}:{app:'calendar',title:'Calendar',body:'Check tomorrow\'s events'},
    ()=>({app:'setlog',title:'setlog',body:`It's ${pad(now().getHours())}:00 — time to log! 📸 Your mates are waiting`}),
    ()=>({app:'maps',title:'Google Maps',body:rand(['18 min to Home — traffic is light 🚗','A new café opened near you ☕','Roadworks on Old St — expect delays'])}),
    ()=>({app:'uber',title:'Uber',body:rand(['Heading out tonight? Schedule a ride in advance 🚘','20% off your next 3 trips this week'])}),
    ()=>{const m={id:Date.now(),from:'EXIA Operations',addr:'ops@exia.org',subj:'Reminder: Level 4 access review',body:'Please confirm your attendance for the Level 4 access review this week.',t:Date.now(),read:false};D.mails.push(m);save();return{app:'mail',title:'EXIA Operations',body:m.subj}},
    ()=>{const c=rand(D.wa.filter(x=>!x.self));const from=c.group?rand(c.members):c.cid;const t=rand(['ha!','who\'s bringing the wine?','see you Saturday','Julian??','📸','lovely']);c.msgs.push({from,text:t,t:Date.now()});c.unread=(c.unread||0)+1;save();return{app:'whatsapp',title:c.name,body:(c.group?byId(from).name.split(' ')[0]+': ':'')+t,wa:c.id}},
    ()=>{const th=rand(D.igdm);th.msgs.push({me:0,text:rand(IGREP),t:Date.now()});th.unread=(th.unread||0)+1;save();return{app:'instagram',title:th.u,body:th.msgs.at(-1).text,ig:th.u}},
    ()=>{const m={id:Date.now(),from:rand(['Freddie Ashworth','Lottie Fairfax','The Albemarle Club']),addr:'hello@example.com',subj:rand(['Quick one','Saturday?','Your reservation']),body:'Let me know when you have a moment.',t:Date.now(),read:false};D.gmail.push(m);save();return{app:'gmail',title:m.from,body:m.subj}},
    ()=>({app:'weather',title:'Weather',body:'Light rain starting in about 20 min ☔️'}),
    ()=>({app:'news',title:'News',body:rand(NEWS)[0]}),
    ()=>({app:'fitness',title:'Activity',body:'You\'re almost there — a brisk 15-minute walk will close your Move ring.'})
  ];
  const n=rand(pool)();if(force)n.force=true;notify(n);
}
function scheduleNotifs(){setTimeout(()=>{pushRandom();scheduleNotifs()},30000+Math.random()*30000)}

/* ================= lock screen ================= */
let locked=true,screenOff=false;
function renderLockMedia(){const m=$('#lkMedia');if(!m)return;const tr=TRACKS[mus.i];m.style.display=mus.on||mus.pos?'flex':'none';m.innerHTML=`<div style="display:flex;gap:10px;align-items:center"><div style="width:44px;height:44px;border-radius:8px;background:${tr.art};flex:none"></div><div style="flex:1;min-width:0"><b style="font-size:15px">${esc(tr.t)}</b><div style="font-size:13px;opacity:.7">${esc(tr.a)}</div></div></div><div class="prog" style="height:4px"><i style="width:${mus.pos/tr.dur*100}%"></i></div><div style="display:flex;justify-content:space-around;font-size:24px"><span data-lm="-1"><svg width="1em" height="1em" viewBox="0 0 24 24" style="vertical-align:-.12em;fill:currentColor"><path d="M12 6v12L3 12zM21 6v12l-9-6z"/></svg></span><span data-lm="0">${mus.on?'<svg width="1em" height="1em" viewBox="0 0 24 24" style="vertical-align:-.12em;fill:currentColor"><rect x="6" y="4.5" width="4.2" height="15" rx="1.2"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1.2"/></svg>':'<svg width="1em" height="1em" viewBox="0 0 24 24" style="vertical-align:-.12em;fill:currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>'}</span><span data-lm="1"><svg width="1em" height="1em" viewBox="0 0 24 24" style="vertical-align:-.12em;fill:currentColor"><path d="M3 6v12l9-6zM12 6v12l9-6z"/></svg></span></div>`;$$('#lkMedia [data-lm]').forEach(n=>n.onclick=e=>{e.stopPropagation();const k=+n.dataset.lm;k?musNext(k):musToggle();renderLockMedia()})}
function renderLock(){
  const d=now();
  $('#lock').innerHTML=`<div class="wallbg" style="background:${wallLock()}"></div><div style="position:relative;height:100%">
   <div class="lk-date">${ukDate(d)}</div><div class="lk-time">${hm(d)}</div>
   <div id="lkNotifs"><div class="nowp" id="lkMedia" style="display:none"></div>${NOTIFS.slice(0,3).map(ntHTML).join('')}</div>
   <div class="lk-btm"><div class="lk-rb ${S.flash?'on':''}" id="lkFlash">🔦</div><div class="lk-rb" id="lkCam">📷</div></div><div class="lk-hint">Swipe up to open</div></div>`;
  $('#lkFlash').onclick=e=>{e.stopPropagation();S.flash=!S.flash;vib(10);renderLock()};
  $('#lkCam').onclick=e=>{e.stopPropagation();unlock(true);setTimeout(()=>openApp('camera'),350)};
  $$('#lkNotifs [data-n]').forEach(n=>n.onclick=e=>{e.stopPropagation();const x=NOTIFS.splice(+n.dataset.n,1)[0];tapNotif(x)});
  renderLockMedia();
}
function unlock(){if(!locked)return;islandFlash('<span style="font-size:16px">🔓</span>','',700);setTimeout(()=>{locked=false;$('#lock').classList.add('gone');$('#lock').style.transform='';updateSB();renderHome();refreshIsland()},60)}
function lock(){if(current)goHome();closeCC();closeNC();closeSpot();locked=true;const Lk=$('#lock');Lk.style.transition='none';Lk.classList.remove('gone');Lk.style.transform='';void Lk.offsetWidth;Lk.style.transition='';renderLock();updateSB()}
(()=>{const Lk=$('#lock');let sy=null,dy=0;
  Lk.addEventListener('pointerdown',e=>{if(e.target.closest('.lk-rb,.nt,.nowp'))return;sy=e.clientY;dy=0;Lk.style.transition='none'});
  Lk.addEventListener('pointermove',e=>{if(sy===null)return;dy=Math.min(0,(e.clientY-sy)/SCALE);Lk.style.transform=`translateY(${dy}px)`;Lk.style.opacity=1+dy/900});
  const end=()=>{if(sy===null)return;Lk.style.transition='';Lk.style.opacity='';sy=null;if(dy<-120)unlock();else{Lk.style.transform='';if(Math.abs(dy)<4)islandFlash('<span>🔒</span>','<span class="ilabel">Swipe up</span>',900)}};
  Lk.addEventListener('pointerup',end);Lk.addEventListener('pointercancel',end);Lk.addEventListener('dblclick',()=>unlock());
})();

/* ================= gestures ================= */
(()=>{
  let g=null;
  screen.addEventListener('pointerdown',e=>{const r=screen.getBoundingClientRect(),x=(e.clientX-r.left)/SCALE,y=(e.clientY-r.top)/SCALE;if(y<48&&!e.target.closest('#island,#banner')){g={x,cx:e.clientX,cy:e.clientY};e.preventDefault()}},true);
  window.addEventListener('pointerup',e=>{if(!g)return;const dy=(e.clientY-g.cy)/SCALE,dx=(e.clientX-g.cx)/SCALE,tap=Math.abs(dy)<6&&Math.abs(dx)<6;
    if(dy>30||tap){if(g.x>230){ccOpen&&tap?closeCC():openCC()}else if(g.x<160&&!locked){ncOpen&&tap?closeNC():openNC()}}g=null});
  const hi=$('#hi');let hy=null;
  hi.addEventListener('pointerdown',e=>{hy=e.clientY;hi.setPointerCapture(e.pointerId);e.stopPropagation()});
  hi.addEventListener('pointerup',()=>{if(hy===null)return;hy=null;if(locked){unlock();return}goHome()});
  ['#cc','#nc'].forEach(s=>{let sy=null;$(s).addEventListener('pointerdown',e=>{sy=e.clientY});$(s).addEventListener('pointerup',e=>{if(sy!==null&&(e.clientY-sy)/SCALE<-60)s==='#cc'?closeCC():closeNC();sy=null})});
  $('#spot').addEventListener('click',e=>{if(e.target.id==='spot')closeSpot()});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')goHome()});
})();

/* ================= hardware ================= */
let volTO=null;
function showVolHud(){const h=$('#volHud');$('i',h).style.height=S.vol*100+'%';h.classList.add('show');clearTimeout(volTO);volTO=setTimeout(()=>h.classList.remove('show'),1400);if(ccOpen)renderCC()}
$('#bVolUp').onclick=()=>{S.vol=Math.min(1,Math.round((S.vol+1/16)*16)/16);save();showVolHud();if(!mus.on)tone(880,.06,'sine',.7)};
$('#bVolDn').onclick=()=>{S.vol=Math.max(0,Math.round((S.vol-1/16)*16)/16);save();showVolHud();if(!mus.on)tone(880,.06,'sine',.7)};
$('#bAction').onclick=()=>toggle('silent');
$('#bCamCtl').onclick=()=>{if(screenOff)return;const wasL=locked;if(locked)unlock();setTimeout(()=>openApp('camera'),wasL?300:0)};
$('#bPower').onclick=()=>{
  if(alarmOpen){$('#alarmOv [data-o="stop"]').click();return}
  if(call&&call.state==='ringing'){ringStop();return}
  const o=$('#offScreen');if(screenOff){screenOff=false;o.style.display='none';renderLock()}else{lock();screenOff=true;o.style.display='block';vib(10)}};

/* ================= scale & clock ================= */
function fit(){SCALE=Math.min(innerWidth/433,innerHeight/892,1.25);$('#stage').style.transform=`scale(${SCALE})`}
addEventListener('resize',fit);fit();
let lastMin=-1;
setInterval(()=>{const d=now();if(d.getMinutes()!==lastMin){lastMin=d.getMinutes();renderSB();checkAlarms();if(locked){const t=$('.lk-time');t&&(t.textContent=hm(d))}if(!current&&!locked)renderHome();if(current==='clock'&&clk.tab==='world')rerender('clock')}},1000);
setInterval(()=>{S.battery=Math.max(5,S.battery-1);renderSB();save()},120000);
document.addEventListener('pointerdown',()=>ac(),{once:true});

/* ================= init ================= */
applyWall();applyBright();renderSB();renderHome();renderLock();renderCC();updateSB();
setTimeout(()=>notify({app:'messages',title:'Freddie Ashworth',body:'bold words from a man with that backhand 🎾',thread:3}),2500);
setTimeout(()=>{if(!S.focus)pushRandom()},14000);
scheduleNotifs();
})();
</script>
